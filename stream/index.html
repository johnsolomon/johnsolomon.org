<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Family TV</title>
<style>
  html,body { margin:0; height:100%; background:#000; color:#fff; font:17px/1.4 -apple-system, system-ui, sans-serif; }
  .wrap { height:100%; display:flex; flex-direction:column; }
  header { padding:calc(env(safe-area-inset-top) + 14px) 20px 12px; font-weight:700; font-size:22px; letter-spacing:.02em; color:#e50914; }
  iframe { flex:1; width:100%; border:0; background:#000; }
  .empty { flex:1; display:grid; place-items:center; color:#888; padding:24px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>FAMILY TV</header>
  <div class="empty">Coming soon.</div>
</div>
</body>
</html>
