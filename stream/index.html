<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family TV">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Family TV</title>
<style>
  /* ---------- one set of sizes, used everywhere ---------- */
  :root {
    --bg:#0a0a0b; --panel:#141417; --panel-2:#1e1e23; --line:#ffffff12; --fg:#f5f5f7; --muted:#9a9aa3; --accent:#e5383b;
    --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:24px; --fs-hero:clamp(30px, 4.4vw, 52px);
    --r:10px; --side:232px; --gut:clamp(16px, 3vw, 40px); --tile:clamp(170px, 21vw, 290px);
    --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --tabs:0px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html { background:var(--bg); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { margin:0; color:var(--fg); overscroll-behavior:none; height:100%; overflow:hidden; }
  /* The page itself never scrolls — only #app does. On iPhone Safari a scrolling page makes the browser bar
     grow and shrink, which moved the tab bar and swallowed taps near the bottom of the screen. */
  #app { position:fixed; inset:0; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  body { font:400 var(--fs-md)/1.45 var(--font); background:var(--bg); -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; }
  button, input { font:inherit; color:inherit; margin:0; -webkit-appearance:none; appearance:none; }
  button { background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; }
  svg { display:block; flex:none; }
  /* round buttons stay round on every screen */
  .ib { width:40px; height:40px; flex:0 0 40px; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; color:#fff; }
  .ib svg { width:22px; height:22px; }
  .ib.glass { background:#ffffff1f; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  @media (hover:hover) { .ib:hover { background:#ffffff2e; } }

  /* ---------- sidebar (iPad, Mac) ---------- */
  .side { position:fixed; z-index:30; inset:0 auto 0 0; width:var(--side); background:var(--panel); border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 22px) 12px 24px calc(env(safe-area-inset-left) + 12px); overflow-y:auto; display:none; scrollbar-width:none; }
  .side::-webkit-scrollbar { display:none; }
  .brand { font-weight:800; letter-spacing:.08em; font-size:var(--fs-lg); text-transform:uppercase; padding:0 10px; }
  .brand span { color:var(--accent); }
  .search { display:flex; align-items:center; gap:8px; margin:18px 0 14px; padding:0 12px; height:36px; border-radius:9px; background:var(--panel-2); color:var(--muted); }
  .search svg { width:16px; height:16px; }
  .search input { flex:1; min-width:0; border:0; outline:0; background:none; font-size:var(--fs-md); color:var(--fg); -webkit-user-select:text; user-select:text; }
  .search input::placeholder { color:var(--muted); }
  .nav-h { font-size:var(--fs-xs); font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:18px 10px 6px; }
  .nav-i { display:flex; align-items:center; gap:12px; width:100%; height:38px; padding:0 10px; border-radius:8px; font-size:var(--fs-md); font-weight:500; color:#d8d8de; text-align:left; }
  .nav-i svg { width:19px; height:19px; opacity:.85; }
  .nav-i .n { margin-left:auto; font-size:var(--fs-xs); color:var(--muted); }
  .nav-i.on { background:var(--panel-2); color:#fff; }
  @media (hover:hover) { .nav-i:hover { background:#ffffff0d; } }

  /* ---------- tab bar (iPhone) ---------- */
  .tabs { position:fixed; z-index:30; inset:auto 0 0 0; display:flex; background:#0d0d0fee; -webkit-backdrop-filter:blur(20px) saturate(1.6); backdrop-filter:blur(20px) saturate(1.6);
    border-top:1px solid var(--line); padding:6px env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 4px) env(safe-area-inset-left); }
  .tabs button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600; color:var(--muted); padding:4px 0; }
  .tabs svg { width:24px; height:24px; }
  .tabs button.on { color:#fff; }
  .topbar { position:fixed; z-index:20; inset:0 0 auto 0; padding:calc(env(safe-area-inset-top) + 12px) var(--gut) 14px; background:linear-gradient(#0a0a0bdd, #0a0a0b00); pointer-events:none;
    border-bottom:1px solid transparent; transition:background-color .2s, border-color .2s; }
  .topbar.solid { background:#0d0d0fe8; -webkit-backdrop-filter:blur(20px) saturate(1.6); backdrop-filter:blur(20px) saturate(1.6); border-bottom-color:var(--line); }

  @media (min-width:768px) and (min-height:501px), (min-width:768px) and (hover:hover) {
    .side { display:block; }
    .tabs, .topbar { display:none; }
    #app { left:var(--side); }
  }
  @media (max-width:767px), (max-height:500px) and (hover:none) {
    :root { --tabs:calc(58px + env(safe-area-inset-bottom)); --tile:clamp(150px, 42vw, 220px); }
    #app { padding-bottom:var(--tabs); }
  }

  /* ---------- home ---------- */
  .hero { position:relative; height:min(66vh, 600px); min-height:340px; overflow:hidden; }
  .hero-img { position:absolute; inset:0; background:#18181c center/cover no-repeat; }
  .hero::after { content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, #0a0a0bf0 0%, #0a0a0b80 42%, #0a0a0b00 72%), linear-gradient(0deg, var(--bg) 0%, #0a0a0b00 40%); }
  .hero-info { position:absolute; z-index:2; left:var(--gut); right:var(--gut); bottom:10%; max-width:560px; }
  .kicker { font-size:var(--fs-xs); font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#c7c7cf; margin-bottom:10px; }
  .hero h1 { margin:0 0 12px; font-size:var(--fs-hero); line-height:1.04; font-weight:800; letter-spacing:-.02em; }
  .hero p { margin:0 0 20px; color:#d4d4da; font-size:var(--fs-md); max-width:470px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px 0 18px; border-radius:8px;
    font-size:var(--fs-md); font-weight:700; background:#fff; color:#000; white-space:nowrap; }
  .btn svg { width:20px; height:20px; }
  .btn.ghost { background:#ffffff26; color:#fff; padding:0 20px; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  @media (max-width:767px), (max-height:500px) and (hover:none) {
    .hero { height:min(62vh, 520px); }
    .hero-info { bottom:7%; }
    .hero p { -webkit-line-clamp:2; }
  }

  /* ---------- rows, grids, tiles ---------- */
  .content { position:relative; z-index:3; padding-bottom:40px; }
  .hero + .content { margin-top:8px; }
  .row { margin:0 0 26px; }
  .row h2, .page h1 { margin:0 var(--gut) 10px; font-size:var(--fs-lg); font-weight:700; letter-spacing:-.01em; }
  .page { padding:calc(env(safe-area-inset-top) + 28px) 0 0; }
  .page h1 { font-size:var(--fs-xl); margin-bottom:18px; }
  @media (max-width:767px), (max-height:500px) and (hover:none) { .page { padding-top:calc(env(safe-area-inset-top) + 58px); } }
  .rail { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding:0 var(--gut); padding:4px var(--gut) 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .rail::-webkit-scrollbar { display:none; }
  .rail .tile { flex:0 0 var(--tile); scroll-snap-align:start; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(var(--tile), 240px), 1fr)); gap:14px 10px; padding:0 var(--gut); }
  .tile { position:relative; aspect-ratio:16/9; border-radius:var(--r); overflow:hidden; background:var(--panel-2) center/cover no-repeat; transition:transform .2s ease; }
  .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg, #000d 0%, #0000 58%); }
  .tile .t { position:absolute; z-index:1; left:10px; right:10px; bottom:8px; font-size:var(--fs-sm); font-weight:700; text-align:left; line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 4px #0008; }
  .tile .sub { display:block; font-size:var(--fs-xs); font-weight:500; color:#cfcfd6; overflow:hidden; text-overflow:ellipsis; }
  .tile .bar { position:absolute; z-index:1; left:0; right:0; bottom:0; height:3px; background:#ffffff30; }
  .tile .bar i, .ep .bar i { display:block; height:100%; background:var(--accent); }
  @media (hover:hover) { .tile:hover { transform:scale(1.04); z-index:2; } }
  .tile:active { transform:scale(.97); }
  .chips { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; padding:0 var(--gut); margin-bottom:26px; }
  .chip { height:64px; border-radius:var(--r); background:var(--panel-2); font-size:var(--fs-md); font-weight:700; text-align:left; padding:0 16px; }
  .page .search { margin:0 var(--gut) 22px; height:40px; }
  .res-h { font-size:var(--fs-lg); font-weight:700; margin:22px var(--gut) 10px; }
  .empty { color:var(--muted); padding:0 var(--gut); font-size:var(--fs-md); }

  /* ---------- details sheet ---------- */
  .sheet-bg { position:fixed; inset:0; z-index:40; background:#000b; display:none; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .sheet-bg.open { display:block; }
  .sheet { position:relative; max-width:860px; margin:5vh auto; background:var(--panel); border-radius:14px; overflow:hidden; }
  .sheet-art { aspect-ratio:16/8; background:#1a1a1e center/cover no-repeat; position:relative; }
  .sheet-art::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--panel) 0%, #0000 62%); }
  .sheet-head { position:relative; z-index:1; margin-top:-72px; padding:0 24px 6px; }
  .sheet-head h2 { margin:0 0 6px; font-size:var(--fs-xl); font-weight:800; letter-spacing:-.01em; }
  .meta { color:var(--muted); font-size:var(--fs-sm); margin-bottom:10px; }
  .sum { color:#d4d4da; font-size:var(--fs-md); margin:0 0 16px; max-width:640px; }
  .sheet .close { position:absolute; z-index:5; top:12px; right:12px; background:#000a; }
  .seasons { display:flex; gap:8px; flex-wrap:wrap; padding:8px 24px 0; }
  .seasons button { height:32px; padding:0 14px; border-radius:999px; background:#ffffff14; font-size:var(--fs-sm); font-weight:600; }
  .seasons button.on { background:#fff; color:#000; }
  .eps { padding:8px 12px 20px; }
  .ep { display:flex; gap:14px; align-items:center; width:100%; padding:10px 12px; border-radius:10px; text-align:left; }
  @media (hover:hover) { .ep:hover { background:#ffffff0a; } }
  .ep:active { background:#ffffff0f; }
  .ep-n { width:22px; flex:none; color:var(--muted); font-size:var(--fs-md); text-align:center; }
  .ep-img { position:relative; flex:none; width:148px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#222 center/cover no-repeat; }
  .ep .bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:#ffffff33; }
  .ep-t { font-size:var(--fs-md); font-weight:600; min-width:0; }
  @media (max-width:767px), (max-height:500px) and (hover:none) {
    .sheet { margin:0; min-height:100%; border-radius:0; padding-bottom:env(safe-area-inset-bottom); }
    .sheet .close { top:calc(env(safe-area-inset-top) + 10px); }
    .sheet-head { padding:0 16px 6px; } .seasons { padding:8px 16px 0; } .eps { padding:6px 4px 20px; }
    .ep-img { width:124px; }
  }

  /* ---------- player ---------- */
  .player { position:fixed; inset:0; z-index:60; background:#000; display:none; height:100vh; height:100dvh; overflow:hidden; }
  .player.open { display:block; }
  .player video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .pc { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; transition:opacity .25s;
    background:linear-gradient(#000a 0%, #0000 22%, #0000 62%, #000c 100%); }
  .player.hide .pc { opacity:0; }
  .player.hide .pc * { pointer-events:none; }   /* the tap lands on the picture and brings the controls back */
  .player.hide { cursor:none; }
  .pc-top { display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) max(var(--gut), env(safe-area-inset-right)) 0 max(var(--gut), env(safe-area-inset-left)); }
  .pc-title { flex:1; min-width:0; font-size:var(--fs-md); font-weight:700; line-height:1.3; }
  .pc-title small { display:block; font-size:var(--fs-sm); font-weight:500; color:#c9c9d0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pc-title .warn { color:#ffb4a8; white-space:normal; }
  .pc-mid { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); display:flex; align-items:center; gap:clamp(28px, 8vw, 72px); }
  .pc-mid .ib { width:56px; height:56px; flex-basis:56px; }
  .pc-mid .ib svg { width:34px; height:34px; }
  .pc-mid .ib.big { width:76px; height:76px; flex-basis:76px; background:#ffffff1f; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .pc-mid .ib.big svg { width:40px; height:40px; }
  .pc-bot { padding:0 max(var(--gut), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(var(--gut), env(safe-area-inset-left)); }
  .scrub-row { display:flex; align-items:center; gap:14px; }
  .scrub { position:relative; flex:1; height:36px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
  .track { position:relative; width:100%; height:4px; border-radius:2px; background:#ffffff38; transition:height .15s; }
  .scrub:hover .track, .scrub.drag .track { height:6px; }
  .track i { position:absolute; left:0; top:0; bottom:0; border-radius:inherit; }
  .track .buf { background:#ffffff55; width:0; }
  .track .fill { background:var(--accent); width:0; }
  .knob { position:absolute; top:50%; left:0; width:16px; height:16px; aspect-ratio:1; margin:-8px 0 0 -8px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 0 #e5383b55; transition:transform .15s, box-shadow .15s; }
  .scrub.drag .knob { transform:scale(1.35); box-shadow:0 0 0 8px #e5383b33; }
  .bubble { position:absolute; bottom:32px; left:0; transform:translateX(-50%); padding:4px 8px; border-radius:6px; background:#000c;
    font-size:var(--fs-sm); font-weight:600; font-variant-numeric:tabular-nums; opacity:0; transition:opacity .15s; pointer-events:none; }
  .scrub.drag .bubble, .scrub.peek .bubble { opacity:1; }
  .time { font-size:var(--fs-sm); font-variant-numeric:tabular-nums; color:#e6e6ea; min-width:44px; text-align:right; }
  .pc-row { display:flex; align-items:center; gap:6px; margin-top:4px; }
  .pc-row .grow { flex:1; }
  .pc-btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:8px; font-size:var(--fs-sm); font-weight:600; color:#fff; }
  .pc-btn svg { width:20px; height:20px; }
  .pc-btn.on { background:#fff; color:#000; }
  @media (hover:hover) { .pc-btn:hover { background:#ffffff1f; } }
  .flash { position:absolute; top:50%; transform:translateY(-50%); width:96px; height:96px; aspect-ratio:1; border-radius:50%; background:#ffffff26;
    display:grid; place-items:center; font-size:var(--fs-md); font-weight:700; opacity:0; transition:opacity .3s; pointer-events:none; }
  .flash.l { left:12%; } .flash.r { right:12%; }
  .flash.show { opacity:1; transition:none; }
  .spin { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; border:3px solid #ffffff2a;
    border-top-color:#fff; animation:spin .9s linear infinite; display:none; pointer-events:none; }
  .player.wait .spin { display:block; }
  .player.wait .pc-mid .big { opacity:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .menu { position:absolute; z-index:5; top:calc(env(safe-area-inset-top) + 62px); right:max(var(--gut), env(safe-area-inset-right)); min-width:210px;
    background:#1c1c21f2; -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-radius:12px; padding:6px; display:none; }
  .menu.open { display:block; }
  .menu small { display:block; color:var(--muted); font-size:var(--fs-xs); padding:6px 12px 4px; }
  .menu button { display:block; width:100%; text-align:left; height:40px; padding:0 12px; border-radius:8px; font-size:var(--fs-md); }
  .menu button.on { color:var(--accent); font-weight:700; }
  @media (hover:hover) { .menu button:hover { background:#ffffff12; } }
  .nextup { position:absolute; right:max(var(--gut), env(safe-area-inset-right)); bottom:calc(env(safe-area-inset-bottom) + 118px); display:none; align-items:center; gap:12px;
    background:#16161af2; -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-radius:12px; padding:12px 12px 12px 16px; max-width:min(420px, calc(100vw - 32px)); }
  .nextup.show { display:flex; }
  .nextup .lbl { flex:1; min-width:0; }
  .nextup .lbl small { display:block; color:var(--muted); font-size:var(--fs-xs); }
  .nextup .lbl b { display:block; font-size:var(--fs-md); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nextup .btn { height:38px; padding:0 14px; font-size:var(--fs-sm); }
  .nextup .x { font-size:var(--fs-sm); color:var(--muted); padding:8px; }
  @media (max-width:767px), (max-height:500px) and (hover:none) {
    .pc-mid .ib { width:48px; height:48px; flex-basis:48px; } .pc-mid .ib svg { width:30px; height:30px; }
    .pc-mid .ib.big { width:68px; height:68px; flex-basis:68px; }
    .pc-btn .lbl { display:none; }
  }

  /* ---------- TV remote / keyboard: a clear highlight on whatever is selected ---------- */
  .kbd :focus { outline:none; }
  .kbd button:focus, .kbd input:focus, .kbd .scrub:focus { box-shadow:0 0 0 3px #fff; }
  .kbd .tile:focus { transform:scale(1.06); z-index:2; box-shadow:0 0 0 3px #fff, 0 12px 30px #000a; }
  .kbd .nav-i:focus { background:#ffffff26; box-shadow:none; color:#fff; }
  .kbd .scrub:focus { box-shadow:none; } .kbd .scrub:focus .knob { transform:scale(1.35); box-shadow:0 0 0 6px #ffffff55; }
  .kbd .ep:focus { background:#ffffff1a; box-shadow:0 0 0 3px #fff; }
  .kbd .chip:focus, .kbd .pad button:focus { background:#ffffff4d; }
  /* across-the-room sizes, with margins TVs won't cut off */
  .tv { --fs-xs:14px; --fs-sm:15px; --fs-md:18px; --fs-lg:22px; --fs-xl:30px; --fs-hero:clamp(40px, 5vw, 64px); --gut:max(4vw, 32px); --tile:clamp(220px, 20vw, 320px); --side:260px; cursor:none; }
  .tv .side { padding-top:36px; padding-left:24px; }
  .tv .nav-i { height:44px; }
  .tv .pc-top { padding-top:4vh; } .tv .pc-bot { padding-bottom:5vh; }
  .tv #pPip, .tv #pFull { display:none !important; }

  /* ---------- messages ---------- */
  .msg { min-height:70vh; display:grid; place-items:center; text-align:center; padding:0 8vw; color:var(--muted); }
  .msg b { display:block; color:var(--fg); font-size:var(--fs-lg); margin-bottom:6px; }
  .msg .spin { position:static; display:block; margin:0 auto 14px; }

  /* ---------- passcode, modeled on the iPhone lock screen ---------- */
  .lock { position:fixed; inset:0; z-index:80; display:none; place-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); background:radial-gradient(120% 80% at 50% 0%, #2a2a34 0%, #0a0a0b 70%); }
  .lock.open { display:grid; }
  .lock-box { display:flex; flex-direction:column; align-items:center; }
  .lock-title { font-size:20px; font-weight:400; margin:0 0 8px; }
  .lock-sub { font-size:var(--fs-sm); color:#c9c9d1; margin:0 0 18px; min-height:18px; text-align:center; }
  .dots { display:flex; gap:24px; margin-bottom:48px; }
  .dots i { width:13px; height:13px; flex:none; aspect-ratio:1; border-radius:50%; border:1.5px solid #fff; transition:background .08s; }
  .dots i.on { background:#fff; }
  .dots.bad { animation:shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90% { transform:translateX(-3px) } 20%,80% { transform:translateX(6px) } 30%,50%,70% { transform:translateX(-12px) } 40%,60% { transform:translateX(12px) } }
  .pad { display:grid; grid-template-columns:repeat(3, 76px); gap:16px 24px; }
  .pad.off { opacity:.3; pointer-events:none; }
  .pad button { width:76px; height:76px; aspect-ratio:1; border-radius:50%; background:#ffffff26; -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; transition:background .35s ease-out; }
  .pad button.down { background:#ffffff73; transition:none; }

<script>
/* The passcode is checked on the server, which limits wrong guesses. Nothing secret is in this page. */
const GATE = "https://noytzrdrvaztjeytdwma.supabase.co/functions/v1/family-tv";
const I = {   // icons
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4h4v16h-4zM13.5 4h4v16h-4z"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M8 2l4 4 4-4"/></svg>',
  film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};
const VIDEO_EXT = /\.(mp4|m4v|mov|webm)$/i;          // formats browsers can play
const POSTER_NAME = /^(poster|cover|folder)\.(jpe?g|png|webp)$/i;
const SHOW_DIR = /^(shows?|tv|tv shows|series)$/i;
const MOVIE_DIR = /^(movies?|films?)$/i;
const SEASON_DIR = /^(season|series|s)\s*\d+$/i;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric:true, sensitivity:'base' });

/* ---------- small per-device storage ---------- */
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let progress = ls.get('ftv.progress', {});
const pct = id => { const p = progress[id]; return p && p.d ? Math.min(1, p.t / p.d) : 0; };

/* ---------- pCloud ---------- */
let linkCode = null, linkPass = '', API = 'https://api.pcloud.com';
function useLink(link, pass) {
  linkPass = pass || '';
  if (/\/\/e[\w.-]*pcloud\.(link|com)/i.test(link)) API = 'https://eapi.pcloud.com';
  linkCode = (link.match(/[?&]code=([^&#]+)/) || [, link.trim()])[1];
}
async function gate(body) {
  const r = await fetch(GATE, { method: 'POST', body: JSON.stringify(body), cache: 'no-store' });
  return { status: r.status, ...(await r.json().catch(() => ({}))) };
}
async function call(method, params = {}) {
  const q = new URLSearchParams({ code: linkCode, ...(linkPass && { linkpassword: linkPass }), ...params });
  const r = await fetch(`${API}/${method}?${q}`, { referrerPolicy: 'no-referrer', cache: 'no-store' });
  return r.json();
}
async function loadTree() {
  let j = await call('showpublink');
  if (j.result !== 0) {                      // link may live in the other pCloud region
    API = API.includes('eapi') ? 'https://api.pcloud.com' : 'https://eapi.pcloud.com';
    const j2 = await call('showpublink'); if (j2.result === 0) j = j2;
  }
  if (j.result !== 0) throw j;
  return j.metadata;
}
async function thumbs(ids, size) {
  const out = {};
  for (let i = 0; i < ids.length; i += 80) {
    try {
      const j = await call('getpubthumbslinks', { fileids: ids.slice(i, i + 80).join(','), size, crop: 1 });
      (j.thumbs || []).forEach(t => { if (t.result === 0) out[t.fileid] = `https://${t.hosts[0]}${t.path}`; });
    } catch {}
  }
  return out;
}
let ahead = null;                               // next episode's link, fetched before the current one ends
async function videoURL(fileid) {
  if (ahead && ahead.id === fileid && Date.now() - ahead.at < 5 * 60e3) { const u = ahead.url; ahead = null; return u; }
  const j = await call('getpublinkdownload', { fileid });
  if (j.result !== 0) throw j;
  return `https://${j.hosts[0]}${j.path}`;
}

/* ---------- auto-organize ----------
   Episodes are recognized by S01E02 (or 1x02) in the file name, wherever they sit.
   The show name comes from the file name, or from its folder if the name is just "S01E02".
   Everything else is a movie. Top-level folders other than Movies/Shows get their own row.  */
const JUNK = /\b(2160p|1080p|720p|480p|4k|uhd|hdr|x26[45]|h\.?26[45]|hevc|web[-. ]?(dl|rip)?|blu[-. ]?ray|brrip|bdrip|dvdrip|hdtv|aac|ac3|ddp?5\.1|5\.1|10bit|proper|repack|remux|yts|rarbg)\b.*$/i;
const tidy = (s, scene) => s.replace(/[._]+/g, ' ').replace(scene ? JUNK : /$^/, '').replace(/[\[(]\s*[\])]/g, '').replace(/\s+[-–]\s*$/, '').replace(/\s{2,}/g, ' ').trim();
const base = n => n.replace(/\.[^.]+$/, '');
const isVideo = f => !f.isfolder && VIDEO_EXT.test(f.name);
const isImage = f => !f.isfolder && /\.(jpe?g|png|webp)$/i.test(f.name);
const created = f => Date.parse(f.created || f.modified) || 0;

const isScene = name => /[._]/.test(base(name));      // e.g. Show.Name.S01E02.1080p.x264
function parseEpisode(name) {
  const sc = isScene(name), b = base(name).replace(/[._]+/g, ' ');
  const m = b.match(/^(.*?)\s*[-–]?\s*\b(?:s(\d{1,2})\s*e(\d{1,3})|(\d{1,2})x(\d{2,3}))\b\s*[-–:]?\s*(.*)$/i);
  if (!m) return null;
  return { show: tidy(m[1], sc).replace(/\s*\(?(19|20)\d{2}\)?$/, ''), season: +(m[2] || m[4]), ep: +(m[3] || m[5]), title: tidy(m[6], sc) };
}
function parseMovie(name) {
  const sc = isScene(name), b = base(name).replace(/[._]+/g, ' ');
  const y = b.match(/^(.*?)[\s(\[]*((?:19|20)\d{2})[\s)\]]*(.*)$/);
  return y && y[1].trim() ? { title: tidy(y[1], sc), year: y[2] } : { title: tidy(b, sc) };
}

function walk(folder, path, out) {
  const kids = folder.contents || [];
  for (const f of kids) {
    if (f.isfolder) walk(f, [...path, f], out);
    else if (isVideo(f)) out.push({ f, path, siblings: kids });
  }
  return out;
}
const posterIn = folder => (folder && (folder.contents || []).find(s => isImage(s) && POSTER_NAME.test(s.name)) || {}).fileid || null;
function posterFor(f, siblings, folder) {                 // "Moana.jpg" next to "Moana.mp4", else poster.jpg in its folder
  const b = base(f.name).toLowerCase();
  const same = siblings.find(s => isImage(s) && base(s.name).toLowerCase() === b);
  return same ? same.fileid : posterIn(folder);
}

function buildCatalog(root) {
  const vids = walk(root, [], []);
  const shows = new Map(), movieRows = new Map();
  const rowFor = path => {
    const top = path[0];
    return !top || MOVIE_DIR.test(top.name) || SHOW_DIR.test(top.name) ? 'Movies' : top.name;
  };
  for (const v of vids) {
    const ep = parseEpisode(v.f.name);
    const parent = v.path[v.path.length - 1];
    // a folder of episodes inside Shows/ counts as a show even without S01E02 names
    const inShowDir = v.path[0] && SHOW_DIR.test(v.path[0].name) && v.path.length >= 2;
    if (ep || inShowDir) {
      const showFolder = inShowDir ? v.path[1] : (parent && SEASON_DIR.test(parent.name) ? v.path[v.path.length - 2] : parent);
      const name = (ep && ep.show) || (showFolder && showFolder.name) || 'Videos';
      const key = 's:' + name.toLowerCase();
      if (!shows.has(key)) shows.set(key, { kind: 'show', key, title: name, episodes: [], art: null, added: 0 });
      const s = shows.get(key);
      const seasonFromDir = parent && SEASON_DIR.test(parent.name) ? +(parent.name.match(/\d+/)[0]) : null;
      s.episodes.push({
        id: v.f.fileid, season: ep ? ep.season : seasonFromDir || 1, n: ep ? ep.ep : (+(base(v.f.name).match(/^(?:episode|ep|e)\s*(\d+)/i) || [])[1] || null),
        title: ep ? (ep.title || `Episode ${ep.ep}`) : tidy(base(v.f.name), isScene(v.f.name)), sortName: v.f.name,
        art: posterFor(v.f, v.siblings, null) || v.f.fileid,          // the still the drop folder saved beside the video
      });
      s.added = Math.max(s.added, created(v.f));
      if (!s.art) s.art = posterIn(showFolder);
    } else {
      const row = rowFor(v.path);
      const m = row === 'Movies' ? parseMovie(v.f.name) : { title: tidy(base(v.f.name), false) };   // keep names (and dates) as-is in family videos
      const own = parent && v.path.length >= 2 && !MOVIE_DIR.test(parent.name) ? parent : null; // Movies/Moana/Moana.mp4
      if (!movieRows.has(row)) movieRows.set(row, []);
      movieRows.get(row).push({
        kind: 'movie', key: 'f' + v.f.fileid, title: own && row === 'Movies' ? tidy(own.name, false) : m.title, year: m.year,
        art: posterFor(v.f, v.siblings, own) || v.f.fileid, added: created(v.f),
        episodes: [{ id: v.f.fileid, title: m.title, n: null, idx: 0 }],
      });
    }
  }
  const showList = [...shows.values()].map(s => {
    s.episodes.sort((a, b) => a.season - b.season || (a.n ?? 1e9) - (b.n ?? 1e9) || natural(a.sortName, b.sortName));
    s.episodes.forEach((e, i) => e.idx = i);
    const multi = new Set(s.episodes.map(e => e.season)).size > 1;
    s.episodes.forEach(e => e.seasonLabel = multi ? `Season ${e.season}` : '');
    s.art = s.art || s.episodes[0].art;
    return s;
  }).sort((a, b) => natural(a.title, b.title));

  const rows = [];
  const all = [...showList, ...[...movieRows.values()].flat()];
  if (all.length > 11) rows.push({ name: 'Recently Added', items: all.slice().sort((a, b) => b.added - a.added).slice(0, 12), virtual: true });
  if (showList.length) rows.push({ name: 'Shows', items: showList });
  if (movieRows.has('Movies')) rows.push({ name: 'Movies', items: movieRows.get('Movies').sort((a, b) => natural(a.title, b.title)) });
  [...movieRows.keys()].filter(k => k !== 'Movies').sort(natural)
    .forEach(k => rows.push({ name: k, items: movieRows.get(k).sort((a, b) => natural(a.title, b.title)) }));
  return { rows, all, newest: all.slice().sort((a, b) => b.added - a.added)[0] };
}


/* ---------- screens: home, a category, a genre, a mood, search ---------- */
let LIB = { rows: [], all: [] }, ART = {}, HERO_ART = {};
let view = { k: 'home' };
const bg = id => ART[id] ? `background-image:url('${ART[id]}')` : '';
const itemByKey = k => LIB.all.find(i => i.key === k);
const mobile = () => matchMedia('(max-width:767px), (max-height:500px) and (hover:none)').matches;

function continueRow() {
  const seen = new Set(), items = [];
  Object.entries(progress)
    .filter(([, p]) => p.d && p.t / p.d > 0.03 && p.t / p.d < 0.95)
    .sort((a, b) => b[1].ts - a[1].ts)
    .forEach(([id, p]) => {
      const it = itemByKey(p.key); if (!it || seen.has(it.key)) return;
      const ep = it.episodes.find(e => String(e.id) === String(id)); if (!ep) return;
      seen.add(it.key); items.push({ it, ep });
    });
  return items.slice(0, 12);
}
function tileHTML(it, ep) {
  const sub = ep && it.kind === 'show' ? `${ep.n ? 'E' + ep.n + ' · ' : ''}${ep.title}`
    : it.kind === 'show' ? `${it.episodes.length} episodes` : (metaOf(it).genres || [])[0] || '';
  const p = ep ? pct(ep.id) : it.kind === 'movie' ? pct(it.episodes[0].id) : 0;   // movies show how far you got too
  return `<button class="tile" data-key="${esc(it.key)}" ${ep ? `data-ep="${esc(ep.id)}"` : ''} style="${bg(ep && it.kind === 'show' ? ep.art : it.art)}">
    <span class="t">${esc(it.title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span>${p ? `<span class="bar"><i style="width:${p * 100}%"></i></span>` : ''}</button>`;
}
const rowHTML = (name, items, ep) => items.length ? `<section class="row"><h2>${esc(name)}</h2><div class="rail">${items.map(x => ep ? tileHTML(x.it, x.ep) : tileHTML(x)).join('')}</div></section>` : '';
const gridHTML = items => items.length ? `<div class="grid">${items.map(it => tileHTML(it)).join('')}</div>` : `<p class="empty">Nothing here yet.</p>`;

// genres and moods found in this library, for the sidebar and the Browse tab
function genreList() {
  const c = {};
  LIB.all.forEach(it => (metaOf(it).genres || []).forEach(g => (c[g] = (c[g] || 0) + 1)));
  return Object.entries(c).sort((a, b) => b[1] - a[1] || natural(a[0], b[0]));
}
const moodItems = k => LIB.all.filter(it => ((metaOf(it).moods || {})[k] || 0) > 0.5).sort((a, b) => metaOf(b).moods[k] - metaOf(a).moods[k]);
const moodList = () => Object.keys(MOOD_NAMES).map(k => [k, moodItems(k).length]).filter(([, n]) => n);
const folderRows = () => LIB.rows.filter(r => !r.virtual);
// Search results: titles and genres first, then individual episodes whose name matches (tap plays that episode)
function searchHTML(q) {
  const t = q.trim().toLowerCase();
  const titles = LIB.all.filter(it => it.title.toLowerCase().includes(t) || (metaOf(it).genres || []).some(g => g.toLowerCase().includes(t)));
  const eps = LIB.all.filter(it => it.kind === 'show').flatMap(it => it.episodes.filter(e => e.title.toLowerCase().includes(t)).map(e => tileHTML(it, e))).slice(0, 24);
  if (!titles.length && !eps.length) return `<p class="empty">No matches for “${esc(q.trim())}”</p>`;
  return (titles.length ? `<div class="grid">${titles.map(it => tileHTML(it)).join('')}</div>` : '')
    + (eps.length ? `<h2 class="res-h">Episodes</h2><div class="grid">${eps.join('')}</div>` : '');
}

// the phone's top bar turns solid once the page scrolls under it
$('#app').addEventListener('scroll', () => $('.topbar').classList.toggle('solid', $('#app').scrollTop > 40), { passive: true });
let appHTML = null;
function setApp(html) {
  const app = $('#app'), typing = document.activeElement?.matches?.('input') && app.contains(document.activeElement);
  if (html === appHTML || typing) return false;
  const rails = {};
  app.querySelectorAll('.row').forEach(r => { const h = r.querySelector('h2'), x = r.querySelector('.rail'); if (h && x) rails[h.textContent] = x.scrollLeft; });

document.addEventListener('click', e => {

function nextUnwatched(it) {
  let best = -1, ts = 0;
  it.episodes.forEach((e, i) => { const p = progress[e.id]; if (p && p.ts > ts && pct(e.id) < 0.95) { ts = p.ts; best = i; } });
  if (best >= 0) return best;

/* ---------- genres, moods and picks (worked out by the server's AI; see loadMeta) ---------- */
let META = ls.get('ftv.meta', {});
const metaOf = it => META[it.key.toLowerCase()] || {};
const MOOD_NAMES = { calm: 'Calm', funny: 'Funny', exciting: 'Exciting', musical: 'Musical', heartwarming: 'Heartwarming', learning: 'Learning' };
const finished = it => it.episodes.every(e => pct(e.id) >= 0.95);
const evening = () => { const h = new Date().getHours(); return h >= 18 || h < 6; };
async function loadMeta() {
  const items = LIB.all.map(it => ({ key: it.key, title: it.title, kind: it.kind, year: it.year,
    eps: it.kind === 'show' ? it.episodes.slice(0, 25).map(e => e.title) : undefined }));
  const before = JSON.stringify(META);
  for (let i = 0; i < 40; i++) {                // new titles are described one AI step per request
    const r = await gate({ token: ls.get('ftv.token', null), meta: items });
    if (!r.meta) break;
    META = r.meta;
    if (!r.pending) break;
  }
  ls.set('ftv.meta', META);
  if (JSON.stringify(META) !== before && !$('#player').classList.contains('open')) render();
}
// Picked for you: titles most like what's been watched lately (by the AI's similarity scores),
// leaning calm in the evening and upbeat in the day, with a nudge for anything new.
function forYou(skip = new Set()) {
  const now = Date.now(), recent = {};
  Object.values(progress).forEach(p => { if (p.key) recent[p.key.toLowerCase()] = Math.max(recent[p.key.toLowerCase()] || 0, p.ts); });
  const night = evening();
  return LIB.all.filter(it => !skip.has(it.key)).map(it => {
    const m = metaOf(it), sim = Object.fromEntries(m.sim || []), md = m.moods || {};
    let s = 0;
    for (const [k, ts] of Object.entries(recent)) if (k !== it.key.toLowerCase()) s += 0.5 ** ((now - ts) / 6048e5) * ((sim[k] ?? 0.7) - 0.7);
    s += night ? 0.02 * (md.calm || 0) : 0.01 * ((md.funny || 0) + (md.exciting || 0));
    if (now - it.added < 6048e5) s += 0.03;
    if (finished(it)) s -= 0.15;
    return [it, s];
  }).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

/* ---------- player ---------- */
const video = $('#video'), P = $('#player');
let nowItem = null, nowIdx = 0, nextIdx = 1, shuffle = false, nuTimer = null, hideTimer = null, lastSave = 0;
let retries = 0, resumeAt = 0, everPlayed = false, playTicket = 0;
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };

async function playItem(it, idx, keepTime) {
  if (!it) return;
  // iPad/iPhone only start sound-on playback inside a tap; touching the player here,
  // before any waiting, keeps the tap "valid" for when the real file arrives
  if (!keepTime) { try { video.load(); video.play().catch(() => {}); } catch {} retries = 0; resumeAt = 0; everPlayed = false; enterFull(); }
  nowItem = it; nowIdx = Math.max(0, idx);
  if (!keepTime) {
    const n = it.episodes.length;
    nextIdx = shuffle && n > 1 ? (nowIdx + 1 + Math.floor(Math.random() * (n - 1))) % n : nowIdx + 1;
  }
  const ep = it.episodes[nowIdx];
  cancelNext();
  $('#pTitle').innerHTML = it.kind === 'show'
    ? `${esc(it.title)}<small>${ep.seasonLabel ? esc(ep.seasonLabel) + ' · ' : ''}${ep.n ? 'E' + ep.n + ' · ' : ''}${esc(ep.title)}</small>` : esc(it.title);
  $('#pNext').hidden = !upNext();
  P.classList.add('open', 'wait');
  $('#app').style.overflowY = 'hidden';
  paintTime(); showChrome();
  setNowPlaying(it, ep);
  const ticket = ++playTicket;           // only the latest choice may start playing
  try {
    const url = await videoURL(ep.id);
    if (ticket !== playTicket || !P.classList.contains('open')) return;   // closed, or something else was picked meanwhile
    video.src = url;
    video.play().catch(() => {});
  } catch (err) { if (ticket !== playTicket || !P.classList.contains('open')) return; P.classList.remove('wait'); note(err && err.result === 7005 ? 'pCloud’s sharing limit for this month has been reached' : 'Couldn’t reach pCloud — check the internet connection'); }
}
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const canFull = !/FamilyTV-TV|Android TV|GoogleTV|AFT[A-Z]/i.test(navigator.userAgent) && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
// Full screen on the whole player (not just the video), so the next episode keeps playing full screen.
function enterFull() {
  if (!canFull || fsEl()) return;
  try { (P.requestFullscreen || P.webkitRequestFullscreen).call(P)?.catch?.(() => {}); } catch {}
}
function exitFull() { try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.webkitFullscreenElement) document.webkitExitFullscreen(); } catch {} }
const note = msg => { const t = $('#pTitle'); t.querySelector('.warn')?.remove(); t.insertAdjacentHTML('beforeend', `<small class="warn">${esc(msg)}</small>`); showChrome(); };

/* controls: play, ±10 s, scrub bar, next, picture in picture, full screen, AirPlay */
function paintPlay() { $('#pPlay').innerHTML = video.paused ? I.play : I.pause; $('#pPlay').setAttribute('aria-label', video.paused ? 'Play' : 'Pause'); }
let dragging = false, dragAt = 0;
function paintTime() {
  const d = video.duration || 0, t = dragging ? dragAt : video.currentTime || 0, f = d ? t / d : 0;
  $('#fill').style.width = f * 100 + '%'; $('#knob').style.left = f * 100 + '%';
  let b = 0; try { for (let i = 0; i < video.buffered.length; i++) if (video.buffered.start(i) <= video.currentTime + 1) b = Math.max(b, video.buffered.end(i)); } catch {}
  $('#buf').style.width = (d ? Math.min(1, b / d) : 0) * 100 + '%';

    const ticket = playTicket;
    setTimeout(() => { if (ticket === playTicket && P.classList.contains('open')) playItem(nowItem, nowIdx, true); }, 1500 * retries);
  } else { P.classList.remove('wait'); note(everPlayed ? 'Lost connection — go back and try again' : 'This file can’t play in a browser — drop it into the Inbox to convert it'); }
});
window.addEventListener('online', () => { if (P.classList.contains('open') && video.error) { retries = 0; playItem(nowItem, nowIdx, true); } });
video.addEventListener('loadedmetadata', () => {
  if (resumeAt > 1) { video.currentTime = resumeAt; resumeAt = 0; return; }   // after a reconnect
  const p = progress[nowItem?.episodes[nowIdx]?.id];
  if (p && p.t > 10 && p.t < video.duration - 30) video.currentTime = p.t;
  paintTime();
});
video.addEventListener('timeupdate', () => {
  if (!nowItem || !video.duration) return;
  const now = Date.now(); if (now - lastSave < 4000) return; lastSave = now;
  saveProgress();
  if (sleep.until && now >= sleep.until) { video.pause(); return goodnight(); }
  const nx = nextEpisode();
  if (nx && video.duration - video.currentTime < 45 && (!ahead || ahead.id !== nx.id)) {
    ahead = { id: nx.id }; videoURL(nx.id).then(url => ahead = { id: nx.id, url, at: Date.now() }).catch(() => ahead = null);
  }
});
const nextEpisode = () => nowItem && nowItem.episodes[nextIdx];
function saveProgress() {
  const ep = nowItem.episodes[nowIdx];
  progress[ep.id] = { t: video.currentTime, d: video.duration, ts: Date.now(), key: nowItem.key };
  ls.set('ftv.progress', progress);
  dirty[ep.id] = progress[ep.id];
  clearTimeout(syncTimer); syncTimer = setTimeout(syncProgress, video.paused ? 500 : 20e3);
}
// Progress is shared through the lock server, so iPad, phone, Mac and the Apple TV all resume in the same spot.
let dirty = {}, syncTimer = null;
async function syncProgress(all) {
  const token = ls.get('ftv.token', null); if (!token) return;
  const send = all ? progress : dirty; dirty = {};
  try {
    const r = await gate({ token, progress: send });
    if (!r.progress) { Object.assign(dirty, all ? {} : send); return false; }
    let changed = false;
    for (const [id, p] of Object.entries(r.progress)) if (!progress[id] || progress[id].ts < p.ts) { progress[id] = p; changed = true; }
    if (changed) { ls.set('ftv.progress', progress); if (!$('#player').classList.contains('open')) render(); }
    return true;
  } catch { Object.assign(dirty, all ? {} : send); return false; }
}
video.addEventListener('pause', () => nowItem && video.duration && saveProgress());
video.addEventListener('ended', () => {
  saveProgress();
  if (sleep.ep) return goodnight();
  const queue = upNext(); if (!queue) return;
  $('#nuTitle').textContent = queue.label;
  let s = 5; $('#nuSec').textContent = s; $('#nextUp').classList.add('show'); showChrome();
  nuTimer = setInterval(() => { s--; $('#nuSec').textContent = s; if (s <= 0) { cancelNext(); queue.go(); } }, 1000);
  $('#nuPlay').onclick = () => { cancelNext(); queue.go(); };
});
function upNext() {
  if (!nowItem) return null;
  if (nextIdx < nowItem.episodes.length) {
    const it = nowItem, i = nextIdx;
    return { label: it.episodes[i].title, go: () => playItem(it, i) };
  }
  // end of a movie or a show: the top AI pick that hasn't been watched to the end
  const nx = forYou(new Set([nowItem.key])).find(it => !finished(it));
  return nx ? { label: nx.title, go: () => playItem(nx, nextUnwatched(nx)) } : null;
}
function cancelNext() { clearInterval(nuTimer); $('#nextUp').classList.remove('show'); }
$('#nuCancel').onclick = cancelNext;

/* sleep timer: stop after this episode, or after a set time */
let sleep = {};
function paintSleep() {
  $('#pSleep').classList.toggle('glass', !!(sleep.ep || sleep.until));
  $('#sleepMenu').querySelectorAll('[data-sleep]').forEach(b => b.classList.toggle('on',
    b.dataset.sleep === 'ep' ? !!sleep.ep : b.dataset.sleep === '0' ? !(sleep.ep || sleep.until) : sleep.mins === +b.dataset.sleep));
}
function goodnight() { sleep = {}; paintSleep(); cancelNext(); note('Sleep timer finished — press play to keep watching'); }
$('#pSleep').onclick = e => { e.stopPropagation(); paintSleep(); $('#sleepMenu').classList.toggle('open'); showChrome(); };
$('#sleepMenu').onclick = e => {
  e.stopPropagation();
  const b = e.target.closest('[data-sleep]'); if (!b) return;
  const v = b.dataset.sleep;
  sleep = v === 'ep' ? { ep: true } : +v ? { until: Date.now() + v * 60e3, mins: +v } : {};
  $('#sleepMenu').classList.remove('open'); paintSleep(); showChrome();
};

/* lock screen / Control Center / AirPods controls, and the title on the lock screen */
function setNowPlaying(it, ep) {
  if (!('mediaSession' in navigator)) return;
  try {
    const art = ART[(it.kind === 'show' ? ep.art : it.art)];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: it.kind === 'show' ? ep.title : it.title, artist: it.kind === 'show' ? it.title : 'Family TV', album: 'Family TV',
      artwork: art ? [{ src: art, sizes: '640x360', type: 'image/jpeg' }] : [],
    });
    const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    on('play', () => video.play()); on('pause', () => video.pause());
    on('seekbackward', d => seekBy(-(d.seekOffset || 10)));
    on('seekforward', d => seekBy(d.seekOffset || 10));
    on('seekto', d => { if (d.seekTime != null) video.currentTime = d.seekTime; });
    on('nexttrack', () => { const q = upNext(); if (q) { cancelNext(); q.go(); } });
  } catch {}
}

/* ---------- TV remote and keyboard ----------
   Arrows move between buttons and tiles, OK/Enter opens, Back/Esc goes back.
   In the player: ←/→ skip 10 s, ↑/↓ reach the buttons, OK plays/pauses; media keys work too.
   Turns on by itself on TVs (and in the Family TV app), or as soon as arrow keys are used anywhere. */
const TV = /FamilyTV-TV|Android TV|GoogleTV|BRAVIA|AFT[A-Z]|SMART-TV|SmartTV|Tizen|Web0S/i.test(navigator.userAgent) || /[?&]tv\b/.test(location.search);
if (TV) document.documentElement.classList.add('tv', 'kbd');
const layer = () => $('#lock.open') || (P.classList.contains('open') && ($('#sleepMenu.open') || P)) || ($('#sheetBg.open') && $('#sheet')) || document.body;
function candidates() {
  return [...layer().querySelectorAll('button, input, [tabindex="0"]')].filter(el => {
    if (el.disabled || el.hidden || el.closest('[hidden], .player:not(.open), .sheet-bg:not(.open), .lock:not(.open), .menu:not(.open)')) return false;
    if (layer() === document.body && el.closest('#player, #sheetBg, #lock')) return false;
    const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden';
  });
}
function moveFocus(dir) {
  const list = candidates(); if (!list.length) return false;
  const cur = list.includes(document.activeElement) ? document.activeElement : null;
  if (!cur) { const first = layer().querySelector('[data-play], [data-sheetplay], #scrub, #pad [data-d="1"], .nav-i.on, .tile') ; (list.includes(first) ? first : list[0]).focus(); return true; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of list) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, dx = x - ax, dy = y - ay;
    const along = dir === 'right' ? dx : dir === 'left' ? -dx : dir === 'down' ? dy : -dy;
    const across = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    if (along <= 4) continue;                                   // only things in that direction
    if ((dir === 'left' || dir === 'right') && across > Math.max(a.height, r.height) * 0.9 && cur.closest('.rail, .pc-row, .pc-mid, .btns')) continue;
    const score = along + across * 2.2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (!best) return false;
  best.focus({ preventScroll: true });
  best.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: TV ? 'auto' : 'smooth' });
  return true;
}
// Back: close whatever is on top; at Home there is nothing left to close (the app then exits)
window.ftvBack = () => {
  if ($('#lock.open')) return false;
  if ($('#sleepMenu.open')) { $('#sleepMenu').classList.remove('open'); return true; }
  if (P.classList.contains('open')) { $('#pBack').click(); return true; }
  if ($('#sheetBg.open')) { closeSheet(); return true; }
  if (view.k !== 'home') { go('home'); return true; }
  return false;
};
const DIRS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
document.addEventListener('pointerdown', () => { if (!TV) document.documentElement.classList.remove('kbd'); }, true);
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, dir = DIRS[k], typing = e.target.matches('input');
  if (dir) document.documentElement.classList.add('kbd');
  if (P.classList.contains('open') && !$('#lock.open')) {
    showChrome();
    const inMenu = $('#sleepMenu.open'), onBtn = document.activeElement?.closest?.('#player button');
    if (k === ' ' || k === 'k' || k === 'MediaPlayPause' || (k === 'Enter' && !onBtn)) { e.preventDefault(); return toggle(); }
    if (k === 'MediaPlay') return video.play();
    if (k === 'MediaPause' || k === 'MediaStop') return video.pause();
    if (k === 'MediaFastForward' || k === 'l') { seekBy(10); return flash('R'); }
    if (k === 'MediaRewind' || k === 'j') { seekBy(-10); return flash('L'); }
    if (k === 'MediaTrackNext' || k === 'n') { const q = upNext(); if (q) { cancelNext(); q.go(); } return; }
    if (k === 'f') return fsEl() ? exitFull() : enterFull();
    if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack') { if (k === 'Escape' && fsEl()) return; e.preventDefault(); return ftvBack(); }
    if (dir) {
      e.preventDefault();
      if (!inMenu && (dir === 'left' || dir === 'right') && !onBtn) { seekBy(dir === 'left' ? -10 : 10); return flash(dir === 'left' ? 'L' : 'R'); }
      if (!moveFocus(dir) && (dir === 'up' || dir === 'down') && onBtn && !inMenu) $('#scrub').focus();
    }
    return;
  }
  if (dir) {
    if (typing && (dir === 'left' || dir === 'right')) return;    // move the cursor inside a search box
    e.preventDefault(); moveFocus(dir); return;
  }
  if ((k === 'Escape' || k === 'BrowserBack' || k === 'GoBack' || (k === 'Backspace' && !typing && !$('#lock.open')))) { if (ftvBack()) e.preventDefault(); }
});
// focus the obvious thing when a screen opens with a remote
function autoFocus(sel) { if (document.documentElement.classList.contains('kbd')) setTimeout(() => { if (!layer().contains(document.activeElement) || document.activeElement === document.body) (layer().querySelector(sel) || candidates()[0])?.focus({ preventScroll: true }); }, 30); }
scrub.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); toggle(); showChrome(); } });
new MutationObserver(() => { if (P.classList.contains('open')) autoFocus('#scrub'); else if ($('#sheetBg.open')) autoFocus('[data-sheetplay]'); else autoFocus('[data-play], .nav-i.on, .tile'); })
  .observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class'] });

$('#pBack').onclick = e => {
  e.stopPropagation();
  sleep = {}; paintSleep(); shuffle = false; $('#sleepMenu').classList.remove('open');
  if (nowItem && video.duration) saveProgress();
  playTicket++; video.pause(); video.removeAttribute('src'); video.load(); cancelNext(); exitFull();
  P.classList.remove('open', 'hide', 'wait'); $('#app').style.overflowY = '';
  render();
};
paintPlay();

/* ---------- start: show the saved copy instantly, then refresh from pCloud ---------- */
async function refresh() {
  if (!linkCode) {                               // opened offline earlier; fetch the link now that we're back online
    const r = await gate({ token: ls.get('ftv.token', null) });
    if (r.link) useLink(r.link, r.pass); else if (r.status === 401) return location.reload(); else throw r;
  }
  const tree = await loadTree();
  ls.set('ftv.tree', tree);
  LIB = buildCatalog(tree);
  render();
  const ids = new Set();
  LIB.all.forEach(it => { ids.add(it.art); if (it.kind === 'show') it.episodes.forEach(e => ids.add(e.art)); });
  ART = await thumbs([...ids], '640x360');
  render();
  syncProgress(!ls.get('ftv.synced', false)).then(ok => ok && ls.set('ftv.synced', true));
  loadMeta().catch(() => {});
}
const PIN_LEN = 4;
const later = iso => { const m = Math.max(1, Math.ceil((Date.parse(iso) - Date.now()) / 60e3));
  return m < 60 ? `${m} minute${m > 1 ? 's' : ''}` : m < 1440 ? `${Math.ceil(m / 60)} hours` : `${Math.ceil(m / 1440)} days`; };
function askPasscode() {
  return new Promise(done => {
    let pin = '', busy = false, wait = null;
    const lock = $('#lock'), dots = $('#dots'), del = $('#lockDel'), pad = $('#pad'), title = $('#lockTitle'), sub = $('#lockSub');
    const paint = () => { [...dots.children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); del.classList.toggle('show', pin.length > 0); };
    const say = (t, s) => { title.textContent = t; sub.textContent = s || ''; };
    const shake = () => { dots.classList.remove('bad'); void dots.offsetWidth; dots.classList.add('bad'); navigator.vibrate?.(200); };
    const lockedUntil = iso => {                // like "iPad is disabled": keypad off until the server allows tries again
      pad.classList.add('off'); clearInterval(wait);
      const tick = () => { if (Date.parse(iso) <= Date.now()) { clearInterval(wait); pad.classList.remove('off'); say('Enter Passcode'); }
        else say('Too many wrong tries', `Try again in ${later(iso)}`); };
      tick(); wait = setInterval(tick, 30e3);
    };
    const press = async d => {
      if (busy || pin.length >= PIN_LEN) return;
      pin += d; paint();
      if (pin.length < PIN_LEN) return;
      busy = true;
      let r;
      try { r = await gate({ pin }); } catch { r = { status: 0 }; }
      if (r.token && r.link) {
        ls.set('ftv.token', r.token); useLink(r.link, r.pass);
        lock.classList.remove('open'); document.removeEventListener('keydown', onKey); clearInterval(wait); return done();
      }
      shake();
      if (r.error === 'locked') lockedUntil(r.retryAfter);
      else if (r.error === 'wrong') say('Enter Passcode', r.left <= 3 ? `Wrong passcode · ${r.left} ${r.left === 1 ? 'try' : 'tries'} left` : 'Wrong passcode');
      else say('Enter Passcode', 'No connection — check the internet and try again');
      setTimeout(() => { pin = ''; paint(); busy = false; }, 500);
    };
    const back = () => { if (!busy) { pin = pin.slice(0, -1); paint(); } };
    const onKey = e => { if (pad.classList.contains('off')) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') back(); };
    // light the key the instant it's touched, like iOS
    pad.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (!b) return; b.classList.add('down'); press(b.dataset.d); });
    pad.addEventListener('click', e => { const b = e.target.closest('button'); if (b && e.detail === 0) press(b.dataset.d); });   // OK on a remote
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => pad.addEventListener(t, () => pad.querySelectorAll('.down').forEach(b => b.classList.remove('down'))));
    del.onclick = back;
    document.addEventListener('keydown', onKey);
    lock.classList.add('open'); paint();
  });
}
(async function init() {
  try { localStorage.removeItem('ftv.pin'); } catch {}     // older versions saved the code itself on the device
  const token = ls.get('ftv.token', null);
  let r = { status: 401 };
  if (token) { try { r = await gate({ token }); } catch { r = { status: 0 }; } }
  if (r.link) useLink(r.link, r.pass);
  else if (r.status === 0 && ls.get('ftv.tree', null)) { /* offline: show the saved library; videos need the internet anyway */ }
  else {
    try { localStorage.removeItem('ftv.token'); localStorage.removeItem('ftv.tree'); } catch {}
    setApp(''); await askPasscode();
  }
  const cached = ls.get('ftv.tree', null);
  if (cached) { try { LIB = buildCatalog(cached); render(); } catch {} }
  try { await refresh(); }
  catch (err) {
    if (cached) return;                          // keep showing the saved library
    const why = { 7001: 'The pCloud link isn’t valid.', 7002: 'This pCloud link was deleted.', 7004: 'This pCloud link has expired.', 7005: 'pCloud’s monthly sharing limit for this link has been reached.' }[err && err.result];
    setApp(`<div class="msg"><div><b>Can't reach the video library</b>${why || 'Check the internet connection and try again.'}</div></div>`);
  }
  // pick up newly added videos when the app comes back to the foreground
  const idle = () => !document.hidden && !$('#player').classList.contains('open');
  document.addEventListener('visibilitychange', () => { if (idle()) refresh().catch(() => {}); });
  setInterval(() => { if (idle()) refresh().catch(() => {}); }, 5 * 60e3);
})();
</script>
