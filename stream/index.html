<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family TV">
<meta name="theme-color" content="#0b0b0e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Family TV</title>
<style>
  :root {
    --bg:#0b0b0e; --panel:#16161b; --fg:#f4f4f5; --muted:#9b9ba3;
    --accent:#e53e34; --radius:6px;
    --tile-w: clamp(200px, 26vw, 300px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); overscroll-behavior:none; }
  body {
    font:15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow-x:hidden; padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }

  /* top bar */
  header {
    position:fixed; inset:0 0 auto 0; z-index:20;
    padding: calc(env(safe-area-inset-top) + 14px) 4vw 14px;
    background:linear-gradient(#0b0b0ee6, #0b0b0e00);
    display:flex; align-items:center; gap:10px;
  }
  .brand { font-weight:800; letter-spacing:.06em; font-size:20px; text-transform:uppercase; }
  .brand span { color:var(--accent); }

  /* hero */
  .hero { position:relative; height:min(72vh, 620px); min-height:360px; overflow:hidden; }
  .hero-img { position:absolute; inset:0; background:#222 center/cover no-repeat; transform:scale(1.03); }
  .hero::after { content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, #0b0b0ee0 0%, #0b0b0e60 45%, #0b0b0e00 70%),
               linear-gradient(0deg, var(--bg) 0%, #0b0b0e00 35%); }
  .hero-info { position:absolute; z-index:2; left:4vw; bottom:14%; max-width:min(560px, 80vw); }
  .hero-kicker { color:var(--muted); font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
  .hero h1 { margin:0 0 18px; font-size:clamp(32px, 6vw, 60px); line-height:1.02; font-weight:800; letter-spacing:-.01em; text-shadow:0 2px 24px #0008; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:11px 24px 11px 20px; border-radius:var(--radius);
    font-weight:700; font-size:17px; background:#fff; color:#000; vertical-align:top; }
  .btn svg { width:22px; height:22px; }
  .btn.ghost { background:#6d6d7466; color:#fff; margin-left:8px; }

  /* rows */
  main { position:relative; z-index:3; margin-top:-8vh; }
  .row { margin:0 0 30px; }
  .row h2 { font-size:19px; font-weight:700; margin:0 4vw 10px; }
  .rail { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding:0 4vw;
    padding:6px 4vw 14px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .rail::-webkit-scrollbar { display:none; }
  .tile { flex:0 0 var(--tile-w); aspect-ratio:16/9; position:relative; border-radius:var(--radius); overflow:hidden;
    background:var(--panel) center/cover no-repeat; scroll-snap-align:start; transition:transform .18s ease; }
  .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,#000c 0%,#0000 55%); }
  .tile .t { position:absolute; z-index:1; left:10px; right:10px; bottom:9px; font-weight:700; font-size:15px;
    text-shadow:0 1px 6px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .tile .sub { display:block; font-weight:500; font-size:12px; color:#d0d0d6; }
  .tile .bar { position:absolute; z-index:1; left:0; right:0; bottom:0; height:4px; background:#ffffff33; }
  .tile .bar i { display:block; height:100%; background:var(--accent); }
  @media (hover:hover) { .tile:hover { transform:scale(1.05); z-index:2; } }
  .tile:active { transform:scale(.97); }

  /* show sheet */
  .sheet-bg { position:fixed; inset:0; z-index:40; background:#000a; display:none; overflow-y:auto; }
  .sheet-bg.open { display:block; }
  .sheet { max-width:860px; margin:6vh auto; background:var(--panel); border-radius:10px; overflow:hidden; position:relative; }
  .sheet-art { aspect-ratio:16/8; background:#222 center/cover no-repeat; position:relative; }
  .sheet-art::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--panel) 0%, #0000 60%); }
  .sheet-head { position:relative; z-index:1; margin-top:-90px; padding:0 28px 8px; }
  .sheet-head h2 { margin:0 0 14px; font-size:clamp(26px,4vw,40px); font-weight:800; }
  .close { position:absolute; z-index:5; top:12px; right:12px; width:38px; height:38px; border-radius:50%;
    background:#000a; display:grid; place-items:center; font-size:22px; line-height:1; }
  .seasons { display:flex; gap:6px; flex-wrap:wrap; padding:10px 28px 0; }
  .seasons button { padding:6px 12px; border-radius:999px; background:#ffffff14; font-size:14px; font-weight:600; }
  .seasons button.on { background:#fff; color:#000; }
  .eps { padding:10px 18px 26px; }
  .ep { display:flex; gap:14px; align-items:center; width:100%; padding:10px; border-radius:8px; text-align:left; }
  .ep:active, .ep:hover { background:#ffffff0d; }
  .ep-n { width:26px; flex:none; color:var(--muted); font-size:20px; text-align:center; }
  .ep-img { flex:none; width:150px; aspect-ratio:16/9; border-radius:5px; background:#222 center/cover no-repeat; position:relative; overflow:hidden; }
  .ep-img .bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:#ffffff33; }
  .ep-img .bar i { display:block; height:100%; background:var(--accent); }
  .ep-t { font-weight:600; }

  /* player */
  .player { position:fixed; inset:0; z-index:60; background:#000; display:none; }
  .player.open { display:block; }
  .player video { width:100%; height:100%; object-fit:contain; background:#000; }
  .p-top { position:absolute; inset:0 0 auto 0; padding:calc(env(safe-area-inset-top) + 12px) 16px 30px;
    display:flex; align-items:center; gap:14px; background:linear-gradient(#000b,#0000); transition:opacity .3s; }
  .p-top.hide { opacity:0; pointer-events:none; }
  .p-back { width:42px; height:42px; border-radius:50%; background:#ffffff1f; display:grid; place-items:center; }
  .p-back svg { width:22px; height:22px; }
  .p-title { font-weight:700; font-size:17px; text-shadow:0 1px 6px #000; }
  .p-title small { display:block; color:#ccc; font-weight:500; font-size:13px; }
  .nextup { position:absolute; right:24px; bottom:90px; background:#111e; border-radius:10px; padding:14px 16px;
    display:none; align-items:center; gap:14px; max-width:min(420px, 86vw); }
  .nextup.show { display:flex; }
  .nextup .btn { padding:9px 16px; font-size:15px; }
  .nextup .x { color:var(--muted); font-size:14px; padding:6px; }

  /* states */
  .msg { min-height:70vh; display:grid; place-items:center; text-align:center; padding:0 8vw; color:var(--muted); }
  .msg b { display:block; color:var(--fg); font-size:20px; margin-bottom:6px; }
  .spinner { width:38px; height:38px; border:3px solid #ffffff22; border-top-color:var(--accent); border-radius:50%; animation:spin 0.9s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* passcode — modeled on the iPhone lock screen */
  .lock { position:fixed; inset:0; z-index:80; display:none; place-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    background:radial-gradient(120% 80% at 50% 0%, #2a2a36 0%, #0b0b0e 70%); }
  .lock.open { display:grid; }
  .lock-box { display:flex; flex-direction:column; align-items:center; }
  .lock-title { font:400 20px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; margin:0 0 22px; }
  .dots { display:flex; gap:24px; margin-bottom:52px; }
  .dots i { width:13px; height:13px; border-radius:50%; border:1.5px solid #fff; transition:background .08s; }
  .dots i.on { background:#fff; }
  .dots.bad { animation:shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 10%,90% { transform:translateX(-3px) } 20%,80% { transform:translateX(6px) }
    30%,50%,70% { transform:translateX(-12px) } 40%,60% { transform:translateX(12px) } }
  .pad { display:grid; grid-template-columns:repeat(3, 78px); column-gap:26px; row-gap:16px; }
  .pad button { width:78px; height:78px; border-radius:50%; background:#ffffff26;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:background .35s ease-out; touch-action:manipulation; }
  .pad button.down { background:#ffffff73; transition:none; }
  .pad b { font:300 36px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
  .pad small { font:600 10px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:.18em; margin-top:2px; height:10px; }
  .pad small:empty { display:none; }
  .lock-del { margin-top:30px; align-self:flex-end; margin-right:8px; font:400 17px -apple-system, sans-serif; visibility:hidden; }
  .lock-del.show { visibility:visible; }
</style>
</head>
<body>
<header><div class="brand">Family<span>TV</span></div></header>
<div id="app"><div class="msg"><div><div class="spinner"></div>Loading…</div></div></div>

<div class="lock" id="lock"><div class="lock-box">
  <p class="lock-title">Enter Passcode</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"><button data-d="1"><b>1</b><small></small></button><button data-d="2"><b>2</b><small>ABC</small></button><button data-d="3"><b>3</b><small>DEF</small></button><button data-d="4"><b>4</b><small>GHI</small></button><button data-d="5"><b>5</b><small>JKL</small></button><button data-d="6"><b>6</b><small>MNO</small></button><button data-d="7"><b>7</b><small>PQRS</small></button><button data-d="8"><b>8</b><small>TUV</small></button><button data-d="9"><b>9</b><small>WXYZ</small></button><span></span><button data-d="0"><b>0</b><small></small></button><span></span></div>
  <button class="lock-del" id="lockDel">Delete</button>
</div></div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<div class="player" id="player">
  <video id="video" playsinline controls preload="auto"></video>
  <div class="p-top" id="pTop">
    <button class="p-back" id="pBack" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="p-title" id="pTitle"></div>
  </div>
  <div class="nextup" id="nextUp">
    <div style="flex:1;min-width:0"><div style="color:#aaa;font-size:12px">Up next in <span id="nuSec">4</span></div>
      <div id="nuTitle" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
    <button class="btn" id="nuPlay">Play</button>
    <button class="x" id="nuCancel">Cancel</button>
  </div>
</div>

<script>
/* The pCloud link is stored encrypted; only the family passcode unlocks it. */
const LOCK = {"salt": "yXePjJkUw+NvQYb6jepDqQ==", "iv": "LlTmSxVS6tsoXMbz", "iter": 310000, "ct": "jxlDzrSJ4Rclu39TizkcKF2dvEt4ajygYOKmOnYkVWmhGWPGvAOT0uEPROJuGOyv5sG20ZFuOHRnC3FHlxQVMJgRlqfEIrvHnFvCJ3A08kdI9KrGDO+zXxDlk0A="};

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const VIDEO_EXT = /\.(mp4|m4v|mov|webm)$/i;          // formats browsers can play
const POSTER_NAME = /^(poster|cover|folder)\.(jpe?g|png|webp)$/i;
const SHOW_DIR = /^(shows?|tv|tv shows|series)$/i;
const MOVIE_DIR = /^(movies?|films?)$/i;
const SEASON_DIR = /^(season|series|s)\s*\d+$/i;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric:true, sensitivity:'base' });

/* ---------- small per-device storage ---------- */
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let progress = ls.get('ftv.progress', {});
const pct = id => { const p = progress[id]; return p && p.d ? Math.min(1, p.t / p.d) : 0; };

/* ---------- pCloud ---------- */
let linkCode = null, API = 'https://api.pcloud.com';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pin) {
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256' },
    raw, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const link = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LOCK.iv) }, key, b64(LOCK.ct)));
  if (/\/\/e[\w.-]*pcloud\.(link|com)/i.test(link)) API = 'https://eapi.pcloud.com';
  return (link.match(/[?&]code=([^&#]+)/) || [, link.trim()])[1];
}
async function call(method, params = {}) {
  const q = new URLSearchParams({ code: linkCode, ...params });
  const r = await fetch(`${API}/${method}?${q}`, { referrerPolicy: 'no-referrer', cache: 'no-store' });
  return r.json();
}
async function loadTree() {
  let j = await call('showpublink');
  if (j.result !== 0) {                      // link may live in the other pCloud region
    API = API.includes('eapi') ? 'https://api.pcloud.com' : 'https://eapi.pcloud.com';
    const j2 = await call('showpublink'); if (j2.result === 0) j = j2;
  }
  if (j.result !== 0) throw j;
  return j.metadata;
}
async function thumbs(ids, size) {
  const out = {};
  for (let i = 0; i < ids.length; i += 80) {
    try {
      const j = await call('getpubthumbslinks', { fileids: ids.slice(i, i + 80).join(','), size, crop: 1 });
      (j.thumbs || []).forEach(t => { if (t.result === 0) out[t.fileid] = `https://${t.hosts[0]}${t.path}`; });
    } catch {}
  }
  return out;
}
let ahead = null;                               // next episode's link, fetched before the current one ends
async function videoURL(fileid) {
  if (ahead && ahead.id === fileid && Date.now() - ahead.at < 5 * 60e3) { const u = ahead.url; ahead = null; return u; }
  const j = await call('getpublinkdownload', { fileid });
  if (j.result !== 0) throw j;
  return `https://${j.hosts[0]}${j.path}`;
}

/* ---------- auto-organize ----------
   Episodes are recognized by S01E02 (or 1x02) in the file name, wherever they sit.
   The show name comes from the file name, or from its folder if the name is just "S01E02".
   Everything else is a movie. Top-level folders other than Movies/Shows get their own row.  */
const JUNK = /\b(2160p|1080p|720p|480p|4k|uhd|hdr|x26[45]|h\.?26[45]|hevc|web[-. ]?(dl|rip)?|blu[-. ]?ray|brrip|bdrip|dvdrip|hdtv|aac|ac3|ddp?5\.1|5\.1|10bit|proper|repack|remux|yts|rarbg)\b.*$/i;
const tidy = s => s.replace(/[._]+/g, ' ').replace(JUNK, '').replace(/[\[(]\s*[\])]/g, '').replace(/\s+[-–]\s*$/, '').replace(/\s{2,}/g, ' ').trim();
const base = n => n.replace(/\.[^.]+$/, '');
const isVideo = f => !f.isfolder && VIDEO_EXT.test(f.name);
const isImage = f => !f.isfolder && /\.(jpe?g|png|webp)$/i.test(f.name);
const created = f => Date.parse(f.created || f.modified) || 0;

function parseEpisode(name) {
  const b = base(name).replace(/[._]+/g, ' ');
  const m = b.match(/^(.*?)\s*[-–]?\s*\b(?:s(\d{1,2})\s*e(\d{1,3})|(\d{1,2})x(\d{2,3}))\b\s*[-–:]?\s*(.*)$/i);
  if (!m) return null;
  return { show: tidy(m[1]).replace(/\s*\(?(19|20)\d{2}\)?$/, ''), season: +(m[2] || m[4]), ep: +(m[3] || m[5]), title: tidy(m[6]) };
}
function parseMovie(name) {
  const b = base(name).replace(/[._]+/g, ' ');
  const y = b.match(/^(.*?)[\s(\[]*((?:19|20)\d{2})[\s)\]]*(.*)$/);
  return y && y[1].trim() ? { title: tidy(y[1]), year: y[2] } : { title: tidy(b) };
}

function walk(folder, path, out) {
  const kids = folder.contents || [];
  for (const f of kids) {
    if (f.isfolder) walk(f, [...path, f], out);
    else if (isVideo(f)) out.push({ f, path, siblings: kids });
  }
  return out;
}
function posterFor(f, siblings, folder) {
  const b = base(f.name).toLowerCase();
  const same = siblings.find(s => isImage(s) && base(s.name).toLowerCase() === b);
  if (same) return same.fileid;
  const p = folder && (folder.contents || []).find(s => isImage(s) && POSTER_NAME.test(s.name));
  return p ? p.fileid : null;
}

function buildCatalog(root) {
  const vids = walk(root, [], []);
  const shows = new Map(), movieRows = new Map();
  const rowFor = path => {
    const top = path[0];
    return !top || MOVIE_DIR.test(top.name) || SHOW_DIR.test(top.name) ? 'Movies' : top.name;
  };
  for (const v of vids) {
    const ep = parseEpisode(v.f.name);
    const parent = v.path[v.path.length - 1];
    // a folder of episodes inside Shows/ counts as a show even without S01E02 names
    const inShowDir = v.path[0] && SHOW_DIR.test(v.path[0].name) && v.path.length >= 2;
    if (ep || inShowDir) {
      const showFolder = inShowDir ? v.path[1] : (parent && SEASON_DIR.test(parent.name) ? v.path[v.path.length - 2] : parent);
      const name = (ep && ep.show) || (showFolder && showFolder.name) || 'Videos';
      const key = 's:' + name.toLowerCase();
      if (!shows.has(key)) shows.set(key, { kind: 'show', key, title: name, episodes: [], art: null, added: 0, folder: showFolder });
      const s = shows.get(key);
      const seasonFromDir = parent && SEASON_DIR.test(parent.name) ? +(parent.name.match(/\d+/)[0]) : null;
      s.episodes.push({
        id: v.f.fileid, season: ep ? ep.season : seasonFromDir || 1, n: ep ? ep.ep : (+(base(v.f.name).match(/^(?:episode|ep|e)\s*(\d+)/i) || [])[1] || null),
        title: ep ? (ep.title || `Episode ${ep.ep}`) : tidy(base(v.f.name)), sortName: v.f.name,
      });
      s.added = Math.max(s.added, created(v.f));
      if (!s.art && showFolder) s.art = posterFor({ name: '' }, [], showFolder);
    } else {
      const row = rowFor(v.path);
      const m = row === 'Movies' ? parseMovie(v.f.name) : { title: tidy(base(v.f.name)) };   // keep dates in family videos
      const own = parent && v.path.length >= 2 && !MOVIE_DIR.test(parent.name) ? parent : null; // Movies/Moana/Moana.mp4
      if (!movieRows.has(row)) movieRows.set(row, []);
      movieRows.get(row).push({
        kind: 'movie', key: 'f' + v.f.fileid, title: own && row === 'Movies' ? tidy(own.name) : m.title, year: m.year,
        art: posterFor(v.f, v.siblings, own) || v.f.fileid, added: created(v.f),
        episodes: [{ id: v.f.fileid, title: m.title, n: null, idx: 0 }],
      });
    }
  }
  const showList = [...shows.values()].map(s => {
    s.episodes.sort((a, b) => a.season - b.season || (a.n ?? 1e9) - (b.n ?? 1e9) || natural(a.sortName, b.sortName));
    s.episodes.forEach((e, i) => e.idx = i);
    const multi = new Set(s.episodes.map(e => e.season)).size > 1;
    s.episodes.forEach(e => e.seasonLabel = multi ? `Season ${e.season}` : '');
    s.art = s.art || s.episodes[0].id;
    return s;
  }).sort((a, b) => natural(a.title, b.title));

  const rows = [];
  const all = [...showList, ...[...movieRows.values()].flat()];
  if (all.length > 3) rows.push({ name: 'Recently Added', items: all.slice().sort((a, b) => b.added - a.added).slice(0, 12), virtual: true });
  if (showList.length) rows.push({ name: 'Shows', items: showList });
  if (movieRows.has('Movies')) rows.push({ name: 'Movies', items: movieRows.get('Movies').sort((a, b) => natural(a.title, b.title)) });
  [...movieRows.keys()].filter(k => k !== 'Movies').sort(natural)
    .forEach(k => rows.push({ name: k, items: movieRows.get(k).sort((a, b) => natural(a.title, b.title)) }));
  return { rows, all, newest: all.slice().sort((a, b) => b.added - a.added)[0] };
}

/* ---------- render ---------- */
let LIB = { rows: [], all: [] }, ART = {}, HERO_ART = {};
const bg = id => ART[id] ? `background-image:url('${ART[id]}')` : '';
const itemByKey = k => LIB.all.find(i => i.key === k);
const homeRow = it => LIB.rows.find(r => !r.virtual && r.items.includes(it));

function continueRow() {
  const seen = new Set(), items = [];
  Object.entries(progress)
    .filter(([, p]) => p.d && p.t / p.d > 0.03 && p.t / p.d < 0.95)
    .sort((a, b) => b[1].ts - a[1].ts)
    .forEach(([id, p]) => {
      const it = itemByKey(p.key); if (!it || seen.has(it.key)) return;
      const ep = it.episodes.find(e => String(e.id) === String(id)); if (!ep) return;
      seen.add(it.key); items.push({ it, ep });
    });
  return items.slice(0, 12);
}
function tileHTML(it, ep) {
  const sub = ep && it.kind === 'show' ? `<span class="sub">${ep.n ? 'E' + ep.n + ' · ' : ''}${esc(ep.title)}</span>`
    : it.kind === 'show' ? `<span class="sub">${it.episodes.length} episodes</span>` : '';
  const p = ep ? pct(ep.id) : 0;
  return `<button class="tile" data-key="${esc(it.key)}" ${ep ? `data-ep="${esc(ep.id)}"` : ''} style="${bg(ep && it.kind === 'show' ? ep.id : it.art)}">
    <span class="t">${esc(it.title)}${sub}</span>${p ? `<span class="bar"><i style="width:${p * 100}%"></i></span>` : ''}</button>`;
}
function render() {
  if (!LIB.all.length) { $('#app').innerHTML = `<div class="msg"><div><b>Nothing here yet</b>Add videos to the shared pCloud folder and they'll show up.</div></div>`; return; }
  const hero = LIB.newest;
  const heroImg = HERO_ART[hero.art] || ART[hero.art];
  const cont = continueRow();
  $('#app').innerHTML = `
    <section class="hero"><div class="hero-img" style="background-image:${heroImg ? `url('${heroImg}')` : 'none'}"></div>
      <div class="hero-info"><div class="hero-kicker">${hero.kind === 'show' ? 'Series' : 'New'}${hero.year ? ' · ' + hero.year : ''}</div><h1>${esc(hero.title)}</h1>
        <button class="btn" data-play="${esc(hero.key)}">${PLAY_ICON}${hero.episodes.some(e => progress[e.id]) ? 'Resume' : 'Play'}</button>${hero.kind === 'show' ? `<button class="btn ghost" data-key="${esc(hero.key)}">Episodes</button>` : ''}</div></section>
    <main>
      ${cont.length ? `<section class="row"><h2>Continue Watching</h2><div class="rail">${cont.map(c => tileHTML(c.it, c.ep)).join('')}</div></section>` : ''}
      ${LIB.rows.map(r => `<section class="row"><h2>${esc(r.name)}</h2><div class="rail">${r.items.map(it => tileHTML(it)).join('')}</div></section>`).join('')}
    </main>`;
}

document.addEventListener('click', e => {
  const play = e.target.closest('[data-play]');
  if (play) { const it = itemByKey(play.dataset.play); return playItem(it, nextUnwatched(it)); }
  const t = e.target.closest('[data-key]');
  if (t && !t.closest('.sheet')) {
    const it = itemByKey(t.dataset.key); if (!it) return;
    if (t.dataset.ep) return playItem(it, it.episodes.findIndex(x => String(x.id) === t.dataset.ep));
    if (it.kind === 'movie') return playItem(it, 0);
    openSheet(it);
  }
});
function nextUnwatched(it) {
  let best = -1, ts = 0;
  it.episodes.forEach((e, i) => { const p = progress[e.id]; if (p && p.ts > ts && pct(e.id) < 0.95) { ts = p.ts; best = i; } });
  if (best >= 0) return best;
  const i = it.episodes.findIndex(e => pct(e.id) < 0.95);
  return i < 0 ? 0 : i;
}

/* ---------- show sheet ---------- */
function openSheet(it, season) {
  const seasons = [...new Set(it.episodes.map(e => e.seasonLabel))];
  const cur = season ?? (it.episodes[nextUnwatched(it)].seasonLabel);
  const eps = it.episodes.filter(e => e.seasonLabel === cur);
  const next = nextUnwatched(it);
  $('#sheet').innerHTML = `
    <button class="close" id="sheetClose" aria-label="Close">×</button>
    <div class="sheet-art" style="${bg(it.art)}"></div>
    <div class="sheet-head"><h2>${esc(it.title)}</h2>
      <button class="btn" data-sheetplay="${next}">${PLAY_ICON}${progress[it.episodes[next].id] ? 'Resume' : 'Play'}</button></div>
    ${seasons.length > 1 ? `<div class="seasons">${seasons.map(s => `<button data-season="${esc(s)}" class="${s === cur ? 'on' : ''}">${esc(s)}</button>`).join('')}</div>` : ''}
    <div class="eps">${eps.map(e => { const p = pct(e.id); return `
      <button class="ep" data-sheetplay="${e.idx}"><span class="ep-n">${e.n ?? e.idx + 1}</span>
        <span class="ep-img" style="${bg(e.id)}">${p ? `<span class="bar"><i style="width:${p * 100}%"></i></span>` : ''}</span>
        <span class="ep-t">${esc(e.title)}</span></button>`; }).join('')}</div>`;
  $('#sheetBg').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#sheet').onclick = ev => {
    const s = ev.target.closest('[data-season]'); if (s) return openSheet(it, s.dataset.season);
    const p = ev.target.closest('[data-sheetplay]'); if (p) { closeSheet(); playItem(it, +p.dataset.sheetplay); }
    if (ev.target.closest('#sheetClose')) closeSheet();
  };
}
function closeSheet() { $('#sheetBg').classList.remove('open'); document.body.style.overflow = ''; }
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });

/* ---------- player ---------- */
const video = $('#video');
let nowItem = null, nowIdx = 0, nuTimer = null, hideTimer = null, lastSave = 0;

let retries = 0, resumeAt = 0, everPlayed = false;
async function playItem(it, idx, keepTime) {
  if (!it) return;
  // iPad/iPhone only start sound-on playback inside a tap; touching the player here,
  // before any waiting, keeps the tap "valid" for when the real file arrives
  if (!keepTime) { try { video.load(); video.play().catch(() => {}); } catch {} retries = 0; resumeAt = 0; everPlayed = false; }
  nowItem = it; nowIdx = Math.max(0, idx);
  const ep = it.episodes[nowIdx];
  cancelNext();
  $('#pTitle').innerHTML = it.kind === 'show'
    ? `${esc(it.title)}<small>${ep.seasonLabel ? esc(ep.seasonLabel) + ' · ' : ''}${ep.n ? 'E' + ep.n + ' · ' : ''}${esc(ep.title)}</small>` : esc(it.title);
  $('#player').classList.add('open');
  document.body.style.overflow = 'hidden';
  showChrome();
  try {
    video.src = await videoURL(ep.id);
    video.play().catch(() => {});
  } catch (err) { note(err && err.result === 7005 ? 'pCloud sharing limit reached for this month' : "Couldn't reach pCloud — check the internet connection"); }
}
const note = msg => { const t = $('#pTitle'); t.querySelector('.warn')?.remove(); t.insertAdjacentHTML('beforeend', `<small class="warn">${esc(msg)}</small>`); };
video.addEventListener('playing', () => { everPlayed = true; retries = 0; $('#pTitle .warn')?.remove(); });
// pCloud video links are tied to the network you're on and expire after a while.
// If playback breaks (Wi-Fi drop, switching networks, long pause), get a fresh link and pick up where it stopped.
video.addEventListener('error', () => {
  if (!video.getAttribute('src') || !nowItem) return;
  if (retries < 3) {
    retries++; resumeAt = Math.max(resumeAt, video.currentTime || 0);
    note('Reconnecting…');
    setTimeout(() => playItem(nowItem, nowIdx, true), 1500 * retries);
  } else note(everPlayed ? 'Lost connection — tap back and try again' : "This file's format can't play in a browser — convert it to MP4 (H.264)");
});
window.addEventListener('online', () => { if ($('#player').classList.contains('open') && video.error) { retries = 0; playItem(nowItem, nowIdx, true); } });
video.addEventListener('loadedmetadata', () => {
  if (resumeAt > 1) { video.currentTime = resumeAt; resumeAt = 0; return; }   // after a reconnect
  const p = progress[nowItem?.episodes[nowIdx]?.id];
  if (p && p.t > 10 && p.t < video.duration - 30) video.currentTime = p.t;
});
video.addEventListener('timeupdate', () => {
  if (!nowItem || !video.duration) return;
  const now = Date.now(); if (now - lastSave < 4000) return; lastSave = now;
  saveProgress();
  const nx = nextEpisode();
  if (nx && video.duration - video.currentTime < 45 && (!ahead || ahead.id !== nx.id)) {
    ahead = { id: nx.id }; videoURL(nx.id).then(url => ahead = { id: nx.id, url, at: Date.now() }).catch(() => ahead = null);
  }
});
const nextEpisode = () => nowItem && nowItem.episodes[nowIdx + 1];
function saveProgress() {
  const ep = nowItem.episodes[nowIdx];
  progress[ep.id] = { t: video.currentTime, d: video.duration, ts: Date.now(), key: nowItem.key };
  ls.set('ftv.progress', progress);
}
video.addEventListener('pause', () => nowItem && video.duration && saveProgress());
video.addEventListener('ended', () => {
  saveProgress();
  const queue = upNext(); if (!queue) return;
  $('#nuTitle').textContent = queue.label;
  let s = 4; $('#nuSec').textContent = s; $('#nextUp').classList.add('show'); showChrome();
  nuTimer = setInterval(() => { s--; $('#nuSec').textContent = s; if (s <= 0) { cancelNext(); queue.go(); } }, 1000);
  $('#nuPlay').onclick = () => { cancelNext(); queue.go(); };
});
function upNext() {
  if (nowIdx + 1 < nowItem.episodes.length) {
    const it = nowItem, i = nowIdx + 1;
    return { label: it.episodes[i].title, go: () => playItem(it, i) };
  }
  const row = homeRow(nowItem);                 // movies roll into the next one in their row
  const nx = row && row.items[row.items.indexOf(nowItem) + 1];
  return nx ? { label: nx.title, go: () => playItem(nx, nextUnwatched(nx)) } : null;
}
function cancelNext() { clearInterval(nuTimer); $('#nextUp').classList.remove('show'); }
$('#nuCancel').onclick = cancelNext;
function showChrome() {
  $('#pTop').classList.remove('hide'); clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (!video.paused) $('#pTop').classList.add('hide'); }, 3000);
}
['pointermove', 'touchstart', 'click'].forEach(ev => $('#player').addEventListener(ev, showChrome, { passive: true }));
$('#pBack').onclick = () => {
  if (nowItem && video.duration) saveProgress();
  video.pause(); video.removeAttribute('src'); video.load(); cancelNext();
  $('#player').classList.remove('open'); document.body.style.overflow = '';
  render();
};

/* ---------- start: show the saved copy instantly, then refresh from pCloud ---------- */
async function refresh() {
  const tree = await loadTree();
  ls.set('ftv.tree', tree);
  LIB = buildCatalog(tree);
  render();
  const ids = new Set();
  LIB.all.forEach(it => { ids.add(it.art); if (it.kind === 'show') it.episodes.forEach(e => ids.add(e.id)); });
  ART = await thumbs([...ids], '640x360');
  if (LIB.newest) HERO_ART = await thumbs([LIB.newest.art], '1280x720');
  render();
}
const PIN_LEN = 4;
function askPasscode() {
  return new Promise(done => {
    let pin = '', busy = false;
    const lock = $('#lock'), dots = $('#dots'), del = $('#lockDel');
    const paint = () => { [...dots.children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); del.classList.toggle('show', pin.length > 0); };
    const press = async d => {
      if (busy || pin.length >= PIN_LEN) return;
      pin += d; paint();
      if (pin.length < PIN_LEN) return;
      busy = true;
      try { linkCode = await unlock(pin); ls.set('ftv.pin', pin); lock.classList.remove('open'); document.removeEventListener('keydown', onKey); done(); }
      catch { dots.classList.remove('bad'); void dots.offsetWidth; dots.classList.add('bad'); navigator.vibrate?.(200);
        setTimeout(() => { pin = ''; paint(); busy = false; }, 500); }
    };
    const back = () => { if (!busy) { pin = pin.slice(0, -1); paint(); } };
    const onKey = e => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') back(); };
    // light the key the instant it's touched, like iOS
    $('#pad').addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (!b) return; b.classList.add('down'); press(b.dataset.d); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => $('#pad').addEventListener(t, () => $('#pad').querySelectorAll('.down').forEach(b => b.classList.remove('down'))));
    del.onclick = back;
    document.addEventListener('keydown', onKey);
    lock.classList.add('open'); paint();
  });
}
(async function init() {
  const saved = ls.get('ftv.pin', null);
  try { if (!saved) throw 0; linkCode = await unlock(saved); }
  catch { $('#app').innerHTML = ''; await askPasscode(); }
  const cached = ls.get('ftv.tree', null);
  if (cached) { try { LIB = buildCatalog(cached); render(); } catch {} }
  try { await refresh(); }
  catch (err) {
    if (cached) return;                          // keep showing the saved library
    const why = { 7001: 'The pCloud link isn’t valid.', 7002: 'This pCloud link was deleted.', 7004: 'This pCloud link has expired.', 7005: 'pCloud’s monthly sharing limit for this link has been reached.' }[err && err.result];
    $('#app').innerHTML = `<div class="msg"><div><b>Can't reach the video library</b>${why || 'Check the internet connection and try again.'}</div></div>`;
  }
  // pick up newly added videos when the app comes back to the foreground
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#player').classList.contains('open')) refresh().catch(() => {}); });
})();
</script>
</body>
</html>
