# Xcode project for the Apple TV app. GitHub turns this into FamilyTV.xcodeproj (see .github/workflows/tvos.yml).
name: FamilyTV
options:
  bundleIdPrefix: org.johnsolomon
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FamilyTV:
    type: application
    platform: tvOS
    sources: [FamilyTV]
    settings:
      base:
        PRODUCT_NAME: FamilyTV
        PRODUCT_BUNDLE_IDENTIFIER: org.johnsolomon.familytv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Family TV
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
