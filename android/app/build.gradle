plugins { id "com.android.application" }

android {
    namespace "org.johnsolomon.familytv"
    compileSdk 34
    defaultConfig {
        applicationId "org.johnsolomon.familytv"
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
    }
    // The signing key is made by the build itself (see .github/workflows/android-tv.yml) and never stored in the repo.
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: ""
            keyAlias "familytv"
            keyPassword System.getenv("KEYSTORE_PASS") ?: ""
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
}
